name: HaMi Agent .NET 11 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj

      - name: Build
        run: dotnet build src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-restore

      - name: Verify changed C# formatting and analyzers (production and tests)
        id: format-check
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/quality/Invoke-HaMiFormat.ps1 -Base $env:BASE_SHA -Mode Check -Restore -SmokeIfEmpty

      - name: Generate formatting correction patch on failure (read-only CI)
        if: failure() && steps.format-check.outcome == 'failure'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/quality/Show-HaMiFormatPatch.ps1 -Base $env:BASE_SHA

      - name: Test HaMi formatter integration and source scope
        shell: pwsh
        run: ./scripts/quality/Test-HaMiFormat.ps1

      - name: Validate versioned development task contract (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --contract-check --contract contracts/development/retry-budget-refinement.json

      - name: Exercise detached multi-file development scope guard (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --self-test

      - name: Validate System.CommandLine and actor-driven retry workflow (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --agent-self-test

      - name: Verify exclusive developer job ownership across processes (offline)
        run: dotnet run --project tests/HaMi.Agentic.JobState.Probe/HaMi.Agentic.JobState.Probe.csproj --configuration Release

      - name: Verify production-verify CLI dispatch reaches reviewed contract gate (offline)
        shell: bash
        run: |
          set +e
          output="$(dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --production-verify --contract contracts/development/invalid.json --worktree "$RUNNER_TEMP/nonexistent-candidate" --results-dir "$RUNNER_TEMP/production-results" 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 1 ] || ! grep -Fq "Unreviewed production verification contract." <<< "$output"; then
            echo "::error::The CLI did not dispatch production verification to its fail-closed contract gate."
            printf '%s\n' "$output"
            exit 1
          fi
          echo "Production verification dispatch reached the contract gate without MicroVM, model, or GitHub writes."


      - name: Validate general C# sandbox runner input isolation (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --sandbox-run-self-test

      - name: Validate Docker Sandbox PoC preflight and report handling (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --sandbox-poc-self-test

      - name: CLI help smoke test (no API key needed)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- replay --help

      - name: Validate historical templates without model call
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- replay --check .

      - name: Reject premature mandatory result fields (regression)
        shell: bash
        run: |
          target="$RUNNER_TEMP/replay-bad"
          mkdir -p "$target/.github/ISSUE_TEMPLATE"
          cp .github/ISSUE_TEMPLATE/*.yml "$target/.github/ISSUE_TEMPLATE/"
          cp .github/pull_request_template.md "$target/.github/pull_request_template.md"
          python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]);s=p.read_text();needle="  - type: textarea\n    id: verification\n";assert needle in s;p.write_text(s.replace(needle,"    validations:\n      required: true\n"+needle,1))' "$target/.github/ISSUE_TEMPLATE/task.yml"
          if dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- replay --check "$target"; then
            echo "::error::Validator accepted mandatory result/progress field"
            exit 1
          fi
          echo "Expected rejection confirmed"

      - name: Verify unattended replay preflight without model access
        shell: bash
        run: |
          set +e
          output="$(dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- replay --unattended 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 2 ] || ! grep -Fq -- "--unattended requires explicit --repo" <<< "$output"; then
            echo "::error::Unattended mode did not reject an implicit repository before an API call"
            exit 1
          fi
          set +e
          output="$(dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- replay --unattended --check . 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 2 ] || ! grep -Fq -- "cannot be combined with read-only --check" <<< "$output"; then
            echo "::error::Unattended mode did not reject the conflicting read-only option"
            exit 1
          fi
          echo "Unattended preflight guards verified without API key or network calls"

      - name: Validate MVP 0.2 two-stage manifest offline
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- workflow --repo . --manifest workflows/mvp02.json --validate

      - name: Verify two-stage orchestration without model or GitHub writes
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- workflow --self-test

      - name: Reject live workflow when API key is absent
        shell: bash
        run: |
          set +e
          output="$(env -u OPENAI_API_KEY dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- workflow --repo . --manifest workflows/mvp02.json --unattended 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 2 ] || ! grep -Fq "No API key configured" <<< "$output"; then
            echo "::error::Workflow was not blocked before starting without an API key"
            exit 1
          fi

      - name: Verify persistent Windows-style settings resolver offline
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- config --self-test

      - name: Verify worktree path and masked named key via config check (no API)
        shell: bash
        run: |
          output="$(env -u OPENAI_API_KEY 'HaMi-AI-Engineering-Agent-Key=ci-secret-must-not-appear' HAMI_AGENT_WORKTREE_ROOT="$RUNNER_TEMP/hami-worktrees" dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- config --check --repo .)"
          if ! grep -Fq "API key: available" <<< "$output" ||
             ! grep -Fq "Worktree root: $RUNNER_TEMP/hami-worktrees" <<< "$output" ||
             grep -Fq "ci-secret-must-not-appear" <<< "$output"; then
            echo "::error::Configuration check failed path/key masking check"
            exit 1
          fi
          echo "Runtime settings check passed without displaying the API key"

      - name: Build trusted fixed C# test fixture
        run: dotnet build samples/ClampKata/ClampKata.csproj --configuration Release --nologo -p:NuGetAudit=false

      - name: Build and test real RetryBudget Coding feature fixture
        run: dotnet run --project samples/RetryBudget/RetryBudget.csproj --configuration Release --nologo

      - name: Validate two bounded coding tasks with real compiler, tests and correction (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --self-test --repo .

      - name: Validate versioned execution policy without API/network access
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --policy-check --repo .

      - name: Validate task-specific retry policy (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --policy-check --task retry-budget --repo .

      - name: Test structured file logging, decisions and defaults without API access
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --self-test-logging --repo .

      - name: Test Microsoft.Extensions.AI IChatClient coding adapter offline
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --self-test-ai --repo .

      - name: Reject live coding without API key
        shell: bash
        run: |
          set +e
          output="$(env -u OPENAI_API_KEY dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --repo . --unattended 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 2 ] || ! grep -Fq "No API key configured" <<< "$output"; then
            echo "::error::Coding execution must be blocked before calling a model without an API key"
            exit 1
          fi

  windows-logging:
    name: Windows file-handle logging regression
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Validate HaMi11 acceptance PowerShell syntax (offline)
        shell: pwsh
        run: |
          foreach ($file in @('Invoke-HaMiSandboxAcceptance.ps1', 'Invoke-HaMiDeveloperAcceptance.ps1', 'Invoke-HaMiProductionCandidateAcceptance.ps1', 'Invoke-HaMiProductionAgentAcceptance.ps1')) {
            $tokens = $null
            $issues = $null
            $path = Join-Path $PWD "scripts/acceptance/$file"
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$issues) | Out-Null
            if ($issues.Count -gt 0) {
              $issues | ForEach-Object { Write-Host "::error::$($_.Message)" }
              exit 1
            }
            Write-Host "Acceptance script syntax valid: $file"
          }

      - name: Compile guest security probe source without running it (offline)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'hami-guest-probe-check'
          New-Item -ItemType Directory -Path $target | Out-Null
          $template = Get-Content 'scripts/acceptance/HostIsolationProbe.cs.txt' -Raw
          $program = $template.Replace('__DRIVE__', 'g').Replace('__RELATIVE__', 'dummy.txt').Replace('__WINJSON__', '"G:\\dummy.txt"')
          [IO.File]::WriteAllText((Join-Path $target 'Program.cs'), $program)
          [IO.File]::WriteAllText((Join-Path $target 'GuestProbe.csproj'), '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net11.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup></Project>')
          dotnet build (Join-Path $target 'GuestProbe.csproj') -c Release -p:NuGetAudit=false --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        run: dotnet restore src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj

      - name: Release build with warnings as errors
        run: dotnet build src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-restore

      - name: Verify changed C# formatting and analyzers (production and tests)
        id: format-check
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/quality/Invoke-HaMiFormat.ps1 -Base $env:BASE_SHA -Mode Check -Restore -SmokeIfEmpty

      - name: Generate formatting correction patch on failure (read-only CI)
        if: failure() && steps.format-check.outcome == 'failure'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/quality/Show-HaMiFormatPatch.ps1 -Base $env:BASE_SHA

      - name: Test HaMi formatter integration and source scope
        shell: pwsh
        run: ./scripts/quality/Test-HaMiFormat.ps1

      - name: Validate development task and detached worktree scope on Windows
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --self-test

      - name: Validate System.CommandLine and Akka retry on Windows (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --agent-self-test

      - name: Verify exclusive developer job ownership across processes (offline)
        run: dotnet run --project tests/HaMi.Agentic.JobState.Probe/HaMi.Agentic.JobState.Probe.csproj --configuration Release

      - name: Validate general C# sandbox runner input isolation on Windows (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --sandbox-run-self-test

      - name: Validate Docker Sandbox PoC report handling on Windows (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- development --repo . --sandbox-poc-self-test

      - name: Assert Serilog file handles are released on Windows
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --self-test-logging --repo .

      - name: Check production RetryBudget expression and correction on Windows
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --self-test --repo .
