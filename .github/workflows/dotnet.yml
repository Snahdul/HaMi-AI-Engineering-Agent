name: HaMi Agent .NET 11 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj

      - name: Build
        run: dotnet build src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-restore

      - name: CLI help smoke test (no API key needed)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- --help

      - name: Validate historical templates without model call
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- --check .

      - name: Reject premature mandatory result fields (regression)
        shell: bash
        run: |
          target="$RUNNER_TEMP/replay-bad"
          mkdir -p "$target/.github/ISSUE_TEMPLATE"
          cp .github/ISSUE_TEMPLATE/*.yml "$target/.github/ISSUE_TEMPLATE/"
          cp .github/pull_request_template.md "$target/.github/pull_request_template.md"
          python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]);s=p.read_text();needle="  - type: textarea\n    id: verification\n";assert needle in s;p.write_text(s.replace(needle,"    validations:\n      required: true\n"+needle,1))' "$target/.github/ISSUE_TEMPLATE/task.yml"
          if dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- --check "$target"; then
            echo "::error::Validator accepted mandatory result/progress field"
            exit 1
          fi
          echo "Expected rejection confirmed"
