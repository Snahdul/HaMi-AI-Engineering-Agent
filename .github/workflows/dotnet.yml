name: HaMi Agent .NET 11 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj

      - name: Build
        run: dotnet build src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-restore

      - name: CLI help smoke test (no API key needed)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- --help

      - name: Validate historical templates without model call
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- --check .

      - name: Reject premature mandatory result fields (regression)
        shell: bash
        run: |
          target="$RUNNER_TEMP/replay-bad"
          mkdir -p "$target/.github/ISSUE_TEMPLATE"
          cp .github/ISSUE_TEMPLATE/*.yml "$target/.github/ISSUE_TEMPLATE/"
          cp .github/pull_request_template.md "$target/.github/pull_request_template.md"
          python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]);s=p.read_text();needle="  - type: textarea\n    id: verification\n";assert needle in s;p.write_text(s.replace(needle,"    validations:\n      required: true\n"+needle,1))' "$target/.github/ISSUE_TEMPLATE/task.yml"
          if dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- --check "$target"; then
            echo "::error::Validator accepted mandatory result/progress field"
            exit 1
          fi
          echo "Expected rejection confirmed"

      - name: Verify unattended replay preflight without model access
        shell: bash
        run: |
          set +e
          output="$(dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- --unattended 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 2 ] || ! grep -Fq -- "--unattended requires explicit --repo" <<< "$output"; then
            echo "::error::Unattended mode did not reject an implicit repository before an API call"
            exit 1
          fi
          set +e
          output="$(dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- --unattended --check . 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 2 ] || ! grep -Fq -- "cannot be combined with read-only --check" <<< "$output"; then
            echo "::error::Unattended mode did not reject the conflicting read-only option"
            exit 1
          fi
          echo "Unattended preflight guards verified without API key or network calls"

      - name: Validate MVP 0.2 two-stage manifest offline
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- workflow --repo . --manifest workflows/mvp02.json --validate

      - name: Verify two-stage orchestration without model or GitHub writes
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- workflow --self-test

      - name: Reject live workflow when API key is absent
        shell: bash
        run: |
          set +e
          output="$(env -u OPENAI_API_KEY dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- workflow --repo . --manifest workflows/mvp02.json --unattended 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 2 ] || ! grep -Fq "No API key configured" <<< "$output"; then
            echo "::error::Workflow was not blocked before starting without an API key"
            exit 1
          fi

      - name: Verify persistent Windows-style settings resolver offline
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- config --self-test

      - name: Verify worktree path and masked named key via config check (no API)
        shell: bash
        run: |
          output="$(env -u OPENAI_API_KEY 'HaMi-AI-Engineering-Agent-Key=ci-secret-must-not-appear' HAMI_AGENT_WORKTREE_ROOT="$RUNNER_TEMP/hami-worktrees" dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- config --check --repo .)"
          if ! grep -Fq "API key: available" <<< "$output" ||
             ! grep -Fq "Worktree root: $RUNNER_TEMP/hami-worktrees" <<< "$output" ||
             grep -Fq "ci-secret-must-not-appear" <<< "$output"; then
            echo "::error::Configuration check failed path/key masking check"
            exit 1
          fi
          echo "Runtime settings check passed without displaying the API key"

      - name: Build trusted fixed C# test fixture
        run: dotnet build samples/ClampKata/ClampKata.csproj --configuration Release --nologo -p:NuGetAudit=false

      - name: Validate coding agent with real compiler, tests and automated correction (offline)
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --self-test --repo .

      - name: Validate versioned execution policy without API/network access
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --policy-check --repo .

      - name: Test Microsoft.Extensions.AI IChatClient coding adapter offline
        run: dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --self-test-ai --repo .

      - name: Reject live coding without API key
        shell: bash
        run: |
          set +e
          output="$(env -u OPENAI_API_KEY dotnet run --project src/HaMi.Agentic.Cli/HaMi.Agentic.Cli.csproj --configuration Release --no-build -- coding --repo . --unattended 2>&1)"
          result=$?
          set -e
          if [ "$result" -ne 2 ] || ! grep -Fq "No API key configured" <<< "$output"; then
            echo "::error::Coding execution must be blocked before calling a model without an API key"
            exit 1
          fi
